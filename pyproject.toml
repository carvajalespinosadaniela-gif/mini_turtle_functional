[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-turtle-drawer"
version = "0.1.0"
description = "Un paquete simple para dibujar con movimientos tipo tortuga usando texto."
readme = "README.md"

authors = [
    {name = "Tu Nombre", email = "tu.correo@example.com"},
]

license = {text = "MIT License"}

keywords = ["turtle", "mini turtle", "drawing", "text graphics"]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = []

[project.urls]
Homepage = "https://example.com"
